project:
  name: robust-ai-image-detection

dataset:
  root: data
  generator_dirs:
    biggan: imagenet_ai_0419_biggan
    adm: imagenet_ai_0508_adm
    glide: imagenet_glide
  train_generators: ["biggan"]
  eval_generators: ["biggan", "adm", "glide"]
  train_split: train
  eval_split: val
  real_class_name: nature
  fake_class_name: ai
  train_percent: 1.0
  allowed_extensions: [".jpg", ".jpeg", ".png"]

preprocessing:
  train_compression: raw
  test_compression: raw

transforms:
  image_size: 224
  interpolation: bilinear

model:
  architecture: resnet50
  pretrained: true

training:
  batch_size: 32
  epochs: 10
  lr: 0.0001
  num_workers: 4
  seed: 42
  checkpoint_dir: outputs/models
