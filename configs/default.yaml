project:
  name: robust-ai-image-detection

dataset:
  root: data
  generator_dirs:
    biggan: imagenet_ai_0419_biggan
    adm: imagenet_ai_0508_adm
    glide: imagenet_glide
    sdv5: imagenet_ai_0424_sdv5
    sdv4: imagenet_ai_0419_sdv4
    wukong: imagenet_ai_0424_wukong
  train_generators: ["biggan"]
  eval_generators: ["biggan", "adm", "glide"]
  train_split: train
  eval_split: val
  real_class_name: nature
  fake_class_name: ai
  train_percent: 1.0
  allowed_extensions: [".jpg", ".jpeg", ".png"]

preprocessing:
  train_compression: raw
  test_compression: raw

size_constraint:
  train_generators: ["sdv5", "sdv4", "wukong"]
  natural_pool_generators: ["sdv5", "sdv4", "wukong"]
  eval_generators: ["sdv5", "sdv4", "wukong"]
  train_compression: jpeg96
  test_compression: jpeg96
  train_percent: 1.0
  natural_min_size: 450
  natural_max_size: 550
  generated_size: 512
  crop_size: 450
  inference_resize_size: 512
  max_train_samples: null
  size_cache: outputs/cache/genimage_image_sizes.json

transforms:
  image_size: 224
  interpolation: bilinear

model:
  architecture: resnet50
  pretrained: true

training:
  batch_size: 32
  epochs: 3
  lr: 0.0001
  weight_decay: 0.01
  selection_metric: roc_auc
  num_workers: 4
  seed: 42
  checkpoint_dir: outputs/models
